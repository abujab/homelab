---
# ==============================================================================
# Task file: verify.yml
#
# Purpose
# -------
# Validate that the node baseline is ready for Kubernetes.
#
# These checks do not change the system. They only fail early if a required
# assumption is not true.
# ==============================================================================

- name: Verify swap is disabled
  ansible.builtin.command: /usr/sbin/swapon --show --noheadings
  register: swap_status
  changed_when: false
  failed_when: swap_status.stdout != ""

- name: Verify chrony service is running
  ansible.builtin.service_facts:

- name: Assert chrony is active
  ansible.builtin.assert:
    that:
      - ansible_facts.services['chrony.service'].state == 'running'
    fail_msg: "chrony is not running"
    success_msg: "chrony is running"

- name: Verify Chrony reports synchronized time
  ansible.builtin.command:
    cmd: chronyc tracking
  register: chrony_tracking
  changed_when: false
  check_mode: false

- name: Assert Chrony reports a trustworthy clock
  ansible.builtin.assert:
    that:
      - "'Leap status     : Normal' in chrony_tracking.stdout"
      - "'Stratum         : 0' not in chrony_tracking.stdout"
    fail_msg: "Chrony does not report a synchronized system clock"
    success_msg: "Chrony reports a synchronized system clock"

- name: Inspect active Chrony sources
  ansible.builtin.command:
    cmd: chronyc -n sources
  register: chrony_sources
  changed_when: false
  check_mode: false

- name: Assert Chrony has one selected source
  ansible.builtin.assert:
    that:
      - chrony_sources.stdout_lines | select('match', '^\\^\\*') | list | length == 1
    fail_msg: "Chrony does not have a selected synchronization source"
    success_msg: "Chrony has a selected synchronization source"

- name: Verify Chrony wait is enabled for boot
  ansible.builtin.command:
    cmd: systemctl is-enabled chrony-wait.service
  register: chrony_wait_enabled
  changed_when: false
  check_mode: false

- name: Assert Chrony wait is enabled for boot
  ansible.builtin.assert:
    that:
      - chrony_wait_enabled.stdout | trim == 'enabled' or ansible_check_mode
    fail_msg: "chrony-wait.service is not enabled"
    success_msg: "chrony-wait.service is enabled"

- name: Verify NetworkManager wait-online is enabled
  ansible.builtin.command:
    cmd: systemctl is-enabled NetworkManager-wait-online.service
  register: network_wait_online_enabled
  changed_when: false
  check_mode: false

- name: Assert NetworkManager wait-online is enabled
  ansible.builtin.assert:
    that:
      - network_wait_online_enabled.stdout | trim == 'enabled'
    fail_msg: "NetworkManager-wait-online.service is not enabled"
    success_msg: "NetworkManager wait-online is enabled"

- name: Verify kernel command line contains K3s cgroup settings
  ansible.builtin.command: cat /proc/cmdline
  register: proc_cmdline
  changed_when: false

- name: Assert cgroup settings are active
  ansible.builtin.assert:
    that:
      - "'cgroup_enable=cpuset' in proc_cmdline.stdout"
      - "'cgroup_memory=1' in proc_cmdline.stdout"
      - "'cgroup_enable=memory' in proc_cmdline.stdout"
    fail_msg: "Required cgroup settings are missing. Reboot may be required."
    success_msg: "Required cgroup settings are active"

- name: Verify cgroup v2 controllers are available
  ansible.builtin.command: cat /sys/fs/cgroup/cgroup.controllers
  register: cgroup_controllers
  changed_when: false

- name: Assert required cgroup controllers are active
  ansible.builtin.assert:
    that:
      - "'memory' in cgroup_controllers.stdout"
      - "'cpuset' in cgroup_controllers.stdout"
    fail_msg: "Required cgroup controllers are not available."
    success_msg: "Required cgroup controllers are available."    

- name: Verify Python is available
  ansible.builtin.command: python3 --version
  register: python_version
  changed_when: false

- name: Show Python version
  ansible.builtin.debug:
    var: python_version.stdout
