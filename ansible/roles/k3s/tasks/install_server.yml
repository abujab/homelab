---
# ==============================================================================
# Task file: server.yml
#
# Purpose
# -------
# Install the first K3s server node.
#
# This node becomes the Kubernetes control plane. It hosts the Kubernetes API
# server and coordinates the worker nodes.
# ==============================================================================

- name: Install K3s server
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | sh -s - server \
      --write-kubeconfig-mode 600 \
      --disable servicelb \
      --disable traefik
  args:
    creates: /etc/systemd/system/k3s.service
    executable: /bin/bash
  environment:
    INSTALL_K3S_SKIP_DOWNLOAD: >-
      {{ 'true' if k3s_install_skip_download | bool else '' }}
    INSTALL_K3S_SKIP_ENABLE: "true"
    INSTALL_K3S_SKIP_START: "true"
  register: k3s_server_install

- name: Inspect the server state after a unit-only installation
  ansible.builtin.command:
    cmd: systemctl is-active k3s.service
  register: k3s_server_state_after_install
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - k3s_server_install is changed
    - not ansible_check_mode

- name: Inspect server enablement after a unit-only installation
  ansible.builtin.command:
    cmd: systemctl is-enabled k3s.service
  register: k3s_server_enablement_after_install
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - k3s_server_install is changed
    - not ansible_check_mode

- name: Assert the new K3s server has not started before its time gate
  ansible.builtin.assert:
    that:
      - k3s_server_state_after_install.stdout | trim != 'active'
      - k3s_server_enablement_after_install.stdout | trim != 'enabled'
    fail_msg: >-
      A newly installed K3s server started or was enabled before the Chrony
      time gate was installed.
  when:
    - k3s_server_install is changed
    - not ansible_check_mode
