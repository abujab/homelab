---
- name: Reload systemd after K3s unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen:
    - Apply K3s systemd changes
    - Reconfigure K3s time recovery

- name: Stop the K3s time-recovery oneshot before rearming it
  ansible.builtin.systemd_service:
    name: homelab-k3s-time-recovery.service
    state: stopped
  listen: Reconfigure K3s time recovery

- name: Clear the previous K3s time-recovery result
  ansible.builtin.command:
    cmd: systemctl reset-failed homelab-k3s-time-recovery.service
  changed_when: true
  listen: Reconfigure K3s time recovery

- name: Restart and rearm the K3s time-recovery timer
  ansible.builtin.systemd_service:
    name: homelab-k3s-time-recovery.timer
    enabled: true
    state: restarted
  listen: Reconfigure K3s time recovery

- name: Restart K3s after service definition changes
  ansible.builtin.systemd_service:
    name: "{{ k3s_systemd_service_name }}"
    state: restarted
  listen: Apply K3s systemd changes
