---
# Inventory owns disk identity and desired filesystem state. An empty list keeps
# the role safe on hosts that have no declared storage.
storage_disks: []

# Operational mode is selected only by the dedicated playbook entry points.
storage_mode: reconcile
storage_destroy_confirmation: ""
storage_target_disk_id: ""

storage_diagnostic_packages:
  - e2fsprogs
  - fio
  - hdparm
  - parted
  - smartmontools
  - usbutils

storage_benchmark_duration_seconds: 30
storage_stability_duration_seconds: 3600
storage_fio_binary: fio
