---
- name: Validate storage inventory configuration
  ansible.builtin.import_tasks: validate-config.yml

- name: Configure declared USB-storage compatibility quirks
  ansible.builtin.import_tasks: configure-usb-quirks.yml

- name: Install storage lifecycle packages
  ansible.builtin.apt:
    name: "{{ storage_diagnostic_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Process declared storage disks
  ansible.builtin.include_tasks: process-disk.yml
  loop: >-
    {{ storage_disks if storage_target_disk_id | length == 0 else
       storage_disks | selectattr('id', 'equalto', storage_target_disk_id) | list }}
  loop_control:
    loop_var: storage_disk
    label: "{{ storage_disk.id }}"
