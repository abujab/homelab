---
# Qualification is file-based and runs only on an already prepared filesystem.
- name: Qualify explicitly selected storage
  hosts: pis
  become: true

  vars:
    storage_mode: qualify

  pre_tasks:
    - name: Require an explicit single-host limit
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - storage_disks | default([]) | length > 0
        fail_msg: "Storage qualification requires one explicitly limited host."
      run_once: true

  roles:
    - storage
