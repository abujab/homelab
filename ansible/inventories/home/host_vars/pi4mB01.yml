---
# Unique network address for this Raspberry Pi.
ansible_host: 192.168.68.101

# Existing qualified USB storage. This filesystem must never be reformatted.
storage_disks:
  - id: data-disk-01
    sequence: 1
    identity:
      persistent_path: /dev/disk/by-id/wwn-0x5000cca59be59bf8
      expected_model: Hitachi HTS545016B9SA02
      expected_serial: 091028PBDB00QCJNRTDP
      expected_wwn: "0x5000cca59be59bf8"
      expected_size_bytes: 160041885696
    filesystem:
      type: ext4
      label: pi-cl-storage
      preserve_existing_label: true
    mount:
      path: /srv/longhorn
      options: defaults,nofail
    partition:
      number: 1
    smart_device_type: sat
    state: present
